<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Create Account</h2>
    <form id="registerForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
          autocomplete="off">
        <span class="text-red-500 text-sm hidden" id="emailError"></span>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
          autocomplete="new-password">
        <span class="text-red-500 text-sm hidden" id="passwordError"></span>
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
          autocomplete="new-password">
        <span class="text-red-500 text-sm hidden" id="confirmPasswordError"></span>
      </div>

      <div class="flex items-center justify-between">
        <button type="submit"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
          Register
        </button>
      </div>

      <p class="text-center text-sm text-gray-600">
        Already have an account?
        <a href="./login.html" class="text-blue-600 hover:text-blue-800">Login here</a>
      </p>
    </form>
  </div>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDu0e6f9V1Es0L1KOJ_amQ9EJ6Zz-RhE7A",
      authDomain: "qltv-7c9be.firebaseapp.com",
      projectId: "qltv-7c9be",
      storageBucket: "qltv-7c9be.firebasestorage.app",
      messagingSenderId: "411515029850",
      appId: "1:411515029850:web:cc90d42dc1bd4712ad0b63",
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Form validation
    function validateForm(email, password, confirmPassword) {
      let isValid = true;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Clear previous errors
      document.querySelectorAll('.text-red-500').forEach(el => el.classList.add('hidden'));

      // Email validation
      if (!emailRegex.test(email)) {
        document.getElementById('emailError').textContent = 'Please enter a valid email address';
        document.getElementById('emailError').classList.remove('hidden');
        isValid = false;
      }

      // Password validation
      if (password.length < 6) {
        document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
        document.getElementById('passwordError').classList.remove('hidden');
        isValid = false;
      }

      // Confirm password validation
      if (password !== confirmPassword) {
        document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
        document.getElementById('confirmPasswordError').classList.remove('hidden');
        isValid = false;
      }

      return isValid;
    }

    // Registration function
    async function registerUser(email, password) {
      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        // Redirect after successful registration
        window.location.href = '/dashboard';
      } catch (error) {
        let errorMessage = 'Registration failed. Please try again.';
        switch (error.code) {
          case 'auth/email-already-in-use':
            errorMessage = 'Email is already registered';
            break;
          case 'auth/invalid-email':
            errorMessage = 'Invalid email address';
            break;
          case 'auth/weak-password':
            errorMessage = 'Password is too weak';
            break;
        }
        alert(errorMessage);
      }
    }

    // Form submission handler
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (validateForm(email, password, confirmPassword)) {
        await registerUser(email, password);
      }
    });

    // Real-time password validation
    document.getElementById('confirmPassword').addEventListener('input', () => {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword && confirmPassword.length > 0) {
        document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
        document.getElementById('confirmPasswordError').classList.remove('hidden');
      } else {
        document.getElementById('confirmPasswordError').classList.add('hidden');
      }
    });
  </script>
</body>

</html>
