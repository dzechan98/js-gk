<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh sách sách</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="bg-gray-100 min-h-screen">
  <!-- Header Component -->
  <header class="bg-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3">
      <div class="flex justify-between items-center">
        <div class="flex items-center">
          <a href="index.html" class="flex items-center">
            <i class="fas fa-book text-blue-600 text-2xl mr-2"></i>
            <span class="text-xl font-bold text-gray-800">Thư Viện Online</span>
          </a>
        </div>
        <div class="flex items-center space-x-4">
          <a href="../cart/index.html" class="text-gray-700 hover:text-blue-600 transition-colors relative">
            <i class="fas fa-shopping-cart mr-1"></i> Giỏ hàng
            <span id="cartCount"
              class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
          </a>
          <a href="../order/index.html" class="text-gray-700 hover:text-blue-600 transition-colors relative">
            <i class="fas fa-clipboard-list mr-1"></i> Đơn hàng
            <!-- <span id="orderCount"
              class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span> -->
          </a>
          <div class="relative" id="userMenuContainer">
            <button id="userMenuButton" class="flex items-center text-gray-700 hover:text-blue-600 transition-colors">
              <i class="fas fa-user-circle text-xl mr-1"></i>
              <span id="userName">Tài khoản</span>
              <i class="fas fa-chevron-down ml-1 text-xs"></i>
            </button>
            <div id="userMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10 hidden">
              <a href="profile.html" class="block px-4 py-2 text-gray-700 hover:bg-blue-500 hover:text-white">
                <i class="fas fa-user mr-2"></i> Hồ sơ
              </a>
              <a href="settings.html" class="block px-4 py-2 text-gray-700 hover:bg-blue-500 hover:text-white">
                <i class="fas fa-cog mr-2"></i> Cài đặt
              </a>
              <div class="border-t border-gray-200 my-1"></div>
              <button id="logoutButton"
                class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-blue-500 hover:text-white">
                <i class="fas fa-sign-out-alt mr-2"></i> Đăng xuất
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto p-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Danh sách sách</h1>
      <div class="flex space-x-2">
        <button id="syncButton"
          class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors">
          <i class="fas fa-sync-alt mr-2"></i>Đồng bộ
        </button>
        <button id="viewModeButton"
          class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
          <i class="fas fa-th-large mr-2"></i>Chế độ xem
        </button>
      </div>
    </div>

    <!-- Thanh tìm kiếm và lọc -->
    <div class="bg-white rounded-lg shadow-md p-4 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên sách hoặc tác giả..."
            class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <button onclick="filterBooks()"
            class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
            <i class="fas fa-search mr-2"></i>Tìm kiếm
          </button>
        </div>
        <div>
          <select id="filterCategory"
            class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Tất cả thể loại</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Danh sách sách -->
    <div class="bg-white rounded-lg shadow-md overflow-hidden p-4">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Danh sách sách</h2>
        <div class="flex items-center">
          <span id="status" class="text-gray-500 text-sm mr-4 hidden">
            <i class="fas fa-sync-alt fa-spin mr-1"></i> Đồng bộ dữ liệu...
          </span>
          <div class="flex space-x-2">
            <button id="gridViewButton" class="text-blue-500 hover:text-blue-700 transition-colors">
              <i class="fas fa-th-large"></i>
            </button>
            <button id="listViewButton" class="text-gray-500 hover:text-blue-700 transition-colors">
              <i class="fas fa-list"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Grid Layout for Books -->
      <div id="bookList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div id="loading" class="col-span-full text-center text-gray-500">
          <i class="fas fa-spinner fa-spin mr-2"></i>Đang tải...
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination Component -->
  <div class="max-w-6xl mx-auto pb-8">
    <div class="flex justify-center mt-6">
      <nav class="flex items-center space-x-2">
        <button id="prevPage"
          class="px-3 py-1 rounded-md bg-white text-gray-700 border hover:bg-gray-100 disabled:opacity-50">
          <i class="fas fa-chevron-left"></i>
        </button>
        <div id="paginationNumbers" class="flex items-center space-x-2">
          <!-- Pagination numbers will be inserted here -->
        </div>
        <button id="nextPage"
          class="px-3 py-1 rounded-md bg-white text-gray-700 border hover:bg-gray-100 disabled:opacity-50">
          <i class="fas fa-chevron-right"></i>
        </button>
      </nav>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      onSnapshot,
      query,
      doc,
      getDoc,
      setDoc,
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDu0e6f9V1Es0L1KOJ_amQ9EJ6Zz-RhE7A",
      authDomain: "qltv-7c9be.firebaseapp.com",
      projectId: "qltv-7c9be",
      storageBucket: "qltv-7c9be.firebasestorage.app",
      messagingSenderId: "411515029850",
      appId: "1:411515029850:web:cc90d42dc1bd4712ad0b63",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let categories = [];
    let unsubscribe = null;
    let allBooks = [];
    let currentPage = 1;
    let booksPerPage = 8;
    let viewMode = "grid"; // 'grid' or 'list'

    async function loadCategories() {
      try {
        document.getElementById("status").classList.remove("hidden");
        const querySnapshot = await getDocs(collection(db, "categories"));
        categories = querySnapshot.docs.map((doc) => ({
          id: doc.id,
          ...doc.data(),
        }));
        populateCategoryFilter();
        document.getElementById("status").classList.add("hidden");
      } catch (error) {
        console.error("Error loading categories:", error);
        showToast("Lỗi khi tải danh mục!", "error");
        document.getElementById("status").classList.add("hidden");
      }
    }

    function populateCategoryFilter() {
      const filter = document.getElementById("filterCategory");
      filter.innerHTML = '<option value="">Tất cả thể loại</option>';
      categories.forEach((category) => {
        filter.innerHTML += `<option value="${category.id}">${category.name}</option>`;
      });
    }

    async function setupRealtimeUpdates() {
      if (unsubscribe) {
        unsubscribe();
      }

      document.getElementById("status").classList.remove("hidden");
      const q = query(collection(db, "books"));
      unsubscribe = onSnapshot(
        q,
        (querySnapshot) => {
          allBooks = querySnapshot.docs.map((doc) => ({
            id: doc.id,
            ...doc.data(),
          }));
          filterBooks();
          updateCartCount();
          document.getElementById("status").classList.add("hidden");
        },
        (error) => {
          console.error("Error listening to books collection:", error);
          showToast("Lỗi theo dõi dữ liệu!", "error");
          document.getElementById("status").classList.add("hidden");
        }
      );
    }

    function filterBooks() {
      const searchTerm = document
        .getElementById("searchInput")
        .value.toLowerCase();
      const selectedCategory =
        document.getElementById("filterCategory").value;

      const filteredBooks = allBooks.filter((book) => {
        const matchesSearch =
          book.title.toLowerCase().includes(searchTerm) ||
          book.author.toLowerCase().includes(searchTerm);
        const matchesCategory =
          !selectedCategory || book.genreId === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      // Reset to first page when filtering
      currentPage = 1;
      renderPagination(filteredBooks.length);
      renderBooks(filteredBooks);
    }

    function renderBooks(books) {
      const bookList = document.getElementById("bookList");
      bookList.innerHTML = "";

      if (books.length === 0) {
        bookList.innerHTML = `
            <div class="col-span-full text-center text-gray-500">
              Không tìm thấy sách phù hợp
            </div>
          `;
        return;
      }

      // Calculate pagination
      const startIndex = (currentPage - 1) * booksPerPage;
      const endIndex = startIndex + booksPerPage;
      const paginatedBooks = books.slice(startIndex, endIndex);

      // Update class based on view mode
      if (viewMode === "grid") {
        bookList.className =
          "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6";
      } else {
        bookList.className = "divide-y divide-gray-200";
      }

      paginatedBooks.forEach((book) => {
        const defaultImageUrl =
          "https://via.placeholder.com/150x200?text=No+Image";
        const imageUrl = book.imageUrl?.trim() || defaultImageUrl;
        const category = categories.find((c) => c.id === book.genreId);

        if (viewMode === "grid") {
          bookList.innerHTML += `
            <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
              <img src="${imageUrl}" alt="${book.title}" 
                   class="w-full h-48 object-cover"
                   onerror="this.src='${defaultImageUrl}'">
              <div class="p-4">
                <h3 class="text-lg font-semibold">${book.title}</h3>
                <p class="text-sm text-gray-600">${book.author}</p>
                <p class="text-sm text-gray-600">${category ? category.name : "Không xác định"
            }</p>
                <p class="text-lg font-bold text-blue-600">${formatPrice(
              book.price
            )}</p>
                <p class="text-sm text-gray-700 truncate">${book.description || "Không có mô tả"
            }</p>
                <button onclick="addToCart('${book.id}')" 
                        class="w-full mt-4 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                  <i class="fas fa-cart-plus mr-2"></i>Thêm vào giỏ hàng
                </button>
              </div>
            </div>
          `;
        } else {
          bookList.innerHTML += `
            <div class="flex py-4 hover:bg-gray-50 transition-colors">
              <img src="${imageUrl}" alt="${book.title}" 
                   class="w-24 h-32 object-cover rounded-md mr-4"
                   onerror="this.src='${defaultImageUrl}'">
              <div class="flex-1">
                <h3 class="text-lg font-semibold">${book.title}</h3>
                <div class="flex flex-wrap gap-2 mb-2">
                  <p class="text-sm text-gray-600">${book.author}</p>
                  <span class="text-gray-400">|</span>
                  <p class="text-sm text-gray-600">${category ? category.name : "Không xác định"
            }</p>
                </div>
                <p class="text-sm text-gray-700 mb-2">${book.description || "Không có mô tả"
            }</p>
                <div class="flex justify-between items-center">
                  <p class="text-lg font-bold text-blue-600">${formatPrice(
              book.price
            )}</p>
                  <button onclick="addToCart('${book.id}')" 
                          class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                    <i class="fas fa-cart-plus mr-2"></i>Thêm vào giỏ hàng
                  </button>
                </div>
              </div>
            </div>
          `;
        }
      });
    }

    function renderPagination(totalBooks) {
      const totalPages = Math.ceil(totalBooks / booksPerPage);
      const paginationNumbers = document.getElementById("paginationNumbers");
      paginationNumbers.innerHTML = "";

      // Previous button
      document.getElementById("prevPage").disabled = currentPage === 1;
      document.getElementById("nextPage").disabled =
        currentPage === totalPages;

      // Generate page numbers
      const maxVisiblePages = 5;
      let startPage = Math.max(
        1,
        currentPage - Math.floor(maxVisiblePages / 2)
      );
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

      if (endPage - startPage + 1 < maxVisiblePages) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }

      // First page
      if (startPage > 1) {
        paginationNumbers.innerHTML += `
          <button onclick="changePage(1)" class="px-3 py-1 rounded-md border hover:bg-gray-100">1</button>
        `;
        if (startPage > 2) {
          paginationNumbers.innerHTML += `
            <span class="px-2">...</span>
          `;
        }
      }

      // Page numbers
      for (let i = startPage; i <= endPage; i++) {
        paginationNumbers.innerHTML += `
          <button onclick="changePage(${i})" class="px-3 py-1 rounded-md ${currentPage === i
            ? "bg-blue-500 text-white"
            : "bg-white text-gray-700 border hover:bg-gray-100"
          }">${i}</button>
        `;
      }

      // Last page
      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          paginationNumbers.innerHTML += `
            <span class="px-2">...</span>
          `;
        }
        paginationNumbers.innerHTML += `
          <button onclick="changePage(${totalPages})" class="px-3 py-1 rounded-md border hover:bg-gray-100">${totalPages}</button>
        `;
      }
    }

    window.changePage = (page) => {
      currentPage = page;
      filterBooks();
    };

    window.addToCart = async (bookId) => {
      const userId = "user1"; // Replace with actual user ID
      const cartRef = doc(db, "carts", userId);

      try {
        const cartDoc = await getDoc(cartRef);
        if (cartDoc.exists()) {
          const cartData = cartDoc.data();
          const itemIndex = cartData.items.findIndex(
            (item) => item.bookId === bookId
          );

          if (itemIndex !== -1) {
            // If the book is already in the cart, increment the quantity
            cartData.items[itemIndex].quantity += 1;
          } else {
            // If the book is not in the cart, add it with quantity 1
            cartData.items.push({ bookId, quantity: 1 });
          }

          await setDoc(cartRef, { items: cartData.items });
          showToast("Đã cập nhật giỏ hàng!", "success");
        } else {
          // If the cart doesn't exist, create it with the new book
          await setDoc(cartRef, { items: [{ bookId, quantity: 1 }] });
          showToast("Đã thêm sách vào giỏ hàng!", "success");
        }
        updateCartCount();
      } catch (error) {
        showToast("Lỗi khi cập nhật giỏ hàng!", "error");
        console.error(error);
      }
    };

    async function updateCartCount() {
      const userId = "user1"; // Replace with actual user ID
      const cartRef = doc(db, "carts", userId);

      try {
        const cartDoc = await getDoc(cartRef);
        if (cartDoc.exists()) {
          const cartData = cartDoc.data();
          const itemCount = cartData.items.reduce(
            (total, item) => total + item.quantity,
            0
          );
          document.getElementById("cartCount").textContent = itemCount;
        } else {
          document.getElementById("cartCount").textContent = "0";
        }
      } catch (error) {
        console.error("Error updating cart count:", error);
      }
    }

    function showToast(message, type = "info") {
      const toast = document.createElement("div");
      toast.className = `fixed top-4 right-4 p-4 rounded-lg text-white ${type === "success"
          ? "bg-green-500"
          : type === "error"
            ? "bg-red-500"
            : type === "warning"
              ? "bg-yellow-500"
              : "bg-blue-500"
        } shadow-lg z-50`;
      toast.innerHTML = `
          <div class="flex items-center">
            <i class="fas fa-${type === "success"
          ? "check-circle"
          : type === "error"
            ? "exclamation-circle"
            : type === "warning"
              ? "exclamation-triangle"
              : "info-circle"
        } mr-2"></i>
            ${message}
          </div>
        `;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.classList.add(
          "opacity-0",
          "transition-opacity",
          "duration-300"
        );
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function formatPrice(price) {
      return new Intl.NumberFormat("vi-VN", {
        style: "currency",
        currency: "VND",
      }).format(price);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await loadCategories();
      setupRealtimeUpdates();

      document
        .getElementById("searchInput")
        .addEventListener("input", filterBooks);
      document
        .getElementById("filterCategory")
        .addEventListener("change", filterBooks);

      // View mode buttons
      document
        .getElementById("gridViewButton")
        .addEventListener("click", () => {
          viewMode = "grid";
          document
            .getElementById("gridViewButton")
            .classList.replace("text-gray-500", "text-blue-500");
          document
            .getElementById("listViewButton")
            .classList.replace("text-blue-500", "text-gray-500");
          filterBooks();
        });

      document
        .getElementById("listViewButton")
        .addEventListener("click", () => {
          viewMode = "list";
          document
            .getElementById("listViewButton")
            .classList.replace("text-gray-500", "text-blue-500");
          document
            .getElementById("gridViewButton")
            .classList.replace("text-blue-500", "text-gray-500");
          filterBooks();
        });

      // Pagination buttons
      document.getElementById("prevPage").addEventListener("click", () => {
        if (currentPage > 1) {
          currentPage--;
          filterBooks();
        }
      });

      document.getElementById("nextPage").addEventListener("click", () => {
        const totalPages = Math.ceil(allBooks.length / booksPerPage);
        if (currentPage < totalPages) {
          currentPage++;
          filterBooks();
        }
      });

      // User menu toggle
      document
        .getElementById("userMenuButton")
        .addEventListener("click", () => {
          document.getElementById("userMenu").classList.toggle("hidden");
        });

      // Close user menu when clicking outside
      document.addEventListener("click", (event) => {
        const container = document.getElementById("userMenuContainer");
        if (!container.contains(event.target)) {
          document.getElementById("userMenu").classList.add("hidden");
        }
      });

      // Sync button
      document
        .getElementById("syncButton")
        .addEventListener("click", async () => {
          document.getElementById("status").classList.remove("hidden");
          await loadCategories();
          setupRealtimeUpdates();
          showToast("Đã đồng bộ dữ liệu thành công!", "success");
        });

      // View mode toggle button
      document
        .getElementById("viewModeButton")
        .addEventListener("click", () => {
          if (viewMode === "grid") {
            viewMode = "list";
            document
              .getElementById("listViewButton")
              .classList.replace("text-gray-500", "text-blue-500");
            document
              .getElementById("gridViewButton")
              .classList.replace("text-blue-500", "text-gray-500");
          } else {
            viewMode = "grid";
            document
              .getElementById("gridViewButton")
              .classList.replace("text-gray-500", "text-blue-500");
            document
              .getElementById("listViewButton")
              .classList.replace("text-blue-500", "text-gray-500");
          }
          filterBooks();
        });
    });

    window.addEventListener("beforeunload", () => {
      if (unsubscribe) {
        unsubscribe();
      }
    });
  </script>
</body>

</html>
