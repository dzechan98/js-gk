<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách sách</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body class="bg-gray-100 min-h-screen">
    <!-- Header Component -->
    <header class="bg-white shadow-md">
      <div class="max-w-6xl mx-auto px-4 py-3">
        <div class="flex justify-between items-center">
          <div class="flex items-center">
            <a class="flex items-center">
              <i class="fas fa-book text-blue-600 text-2xl mr-2"></i>
              <span class="text-xl font-bold text-gray-800">BookStore</span>
            </a>
          </div>
          <div class="flex items-center space-x-4">
            <a
              href="../cart/index.html"
              class="text-gray-700 hover:text-blue-600 transition-colors relative"
            >
              <i class="fas fa-shopping-cart mr-1"></i> Giỏ hàng
              <span
                id="cartCount"
                class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center"
                >0</span
              >
            </a>
            <a
              href="../user-order/index.html"
              class="text-gray-700 hover:text-blue-600 transition-colors relative"
            >
              <i class="fas fa-clipboard-list mr-1"></i> Đơn hàng
              <!-- <span id="orderCount"
              class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span> -->
            </a>
            <div class="relative" id="userMenuContainer">
              <button
                id="userMenuButton"
                class="flex items-center text-gray-700 hover:text-blue-600 transition-colors"
              >
                <i class="fas fa-user-circle text-xl mr-1"></i>
                <span id="userName">Tài khoản</span>
                <i class="fas fa-chevron-down ml-1 text-xs"></i>
              </button>
              <div
                id="userMenu"
                class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10 hidden"
              >
                <a
                  href="profile.html"
                  class="block px-4 py-2 text-gray-700 hover:bg-blue-500 hover:text-white"
                >
                  <i class="fas fa-user mr-2"></i> Hồ sơ
                </a>
                <div class="border-t border-gray-200 my-1"></div>
                <button
                  id="logoutButton"
                  class="block w-full text-left px-4 py-2 text-gray-700 hover:bg-blue-500 hover:text-white"
                >
                  <i class="fas fa-sign-out-alt mr-2"></i> Đăng xuất
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="max-w-6xl mx-auto p-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Danh sách sách</h1>
        <div class="flex space-x-2">
          <button
            id="syncButton"
            class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors"
          >
            <i class="fas fa-sync-alt mr-2"></i>Đồng bộ
          </button>
          <button
            id="viewModeButton"
            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors"
          >
            <i class="fas fa-th-large mr-2"></i>Chế độ xem
          </button>
        </div>
      </div>

      <!-- Thanh tìm kiếm và lọc -->
      <div class="bg-white rounded-lg shadow-md p-4 mb-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <input
              type="text"
              id="searchInput"
              placeholder="Tìm kiếm theo tên sách hoặc tác giả..."
              class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <button
              onclick="filterBooks()"
              class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors"
            >
              <i class="fas fa-search mr-2"></i>Tìm kiếm
            </button>
          </div>
          <div>
            <select
              id="filterCategory"
              class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="">Tất cả thể loại</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Danh sách sách -->
      <div class="bg-white rounded-lg shadow-md overflow-hidden p-4">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold">Danh sách sách</h2>
          <div class="flex items-center">
            <span id="status" class="text-gray-500 text-sm mr-4 hidden">
              <i class="fas fa-sync-alt fa-spin mr-1"></i> Đồng bộ dữ liệu...
            </span>
            <div class="flex space-x-2">
              <button
                id="gridViewButton"
                class="text-blue-500 hover:text-blue-700 transition-colors"
              >
                <i class="fas fa-th-large"></i>
              </button>
              <button
                id="listViewButton"
                class="text-gray-500 hover:text-blue-700 transition-colors"
              >
                <i class="fas fa-list"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Grid Layout for Books -->
        <div
          id="bookList"
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
        >
          <div id="loading" class="col-span-full text-center text-gray-500">
            <i class="fas fa-spinner fa-spin mr-2"></i>Đang tải...
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination Component -->
    <div class="max-w-6xl mx-auto pb-8">
      <div class="flex justify-center mt-6">
        <nav class="flex items-center space-x-2">
          <button
            id="prevPage"
            class="px-3 py-1 rounded-md bg-white text-gray-700 border hover:bg-gray-100 disabled:opacity-50"
          >
            <i class="fas fa-chevron-left"></i>
          </button>
          <div id="paginationNumbers" class="flex items-center space-x-2">
            <!-- Pagination numbers will be inserted here -->
          </div>
          <button
            id="nextPage"
            class="px-3 py-1 rounded-md bg-white text-gray-700 border hover:bg-gray-100 disabled:opacity-50"
          >
            <i class="fas fa-chevron-right"></i>
          </button>
        </nav>
      </div>
    </div>

    <script src="script.js" type="module"></script>
  </body>
</html>
