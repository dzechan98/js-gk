<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chỉnh sửa danh mục</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-3xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Chỉnh sửa danh mục</h1>
        <a href="list.html" class="text-blue-500 hover:text-blue-600">
          <i class="fas fa-arrow-left mr-2"></i>Quay lại
        </a>
      </div>

      <div class="bg-white rounded-lg shadow-md p-6">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Tên danh mục</label
            >
            <input type="text" id="name" class="w-full p-2 border rounded-lg" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Mô tả</label
            >
            <textarea
              id="description"
              rows="3"
              class="w-full p-2 border rounded-lg"
            ></textarea>
          </div>

          <button
            onclick="updateCategory()"
            class="w-full bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600"
          >
            <i class="fas fa-save mr-2"></i>Lưu thay đổi
          </button>
        </div>
      </div>
    </div>

    <script src="edit.js" type="module"></script>
  </body>
</html>
