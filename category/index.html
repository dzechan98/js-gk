<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Categories Manager</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
      <!-- Header -->
      <h1 class="text-3xl font-bold mb-6 text-gray-800">
        Book Categories Manager
      </h1>

      <!-- Category Form -->
      <div class="bg-white p-6 rounded-lg shadow-md mb-6">
        <form id="categoryForm" class="space-y-4">
          <input type="hidden" id="categoryId" />
          <div>
            <label class="block text-sm font-medium text-gray-700"
              >Category Name</label
            >
            <input
              type="text"
              id="categoryName"
              required
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
            />
          </div>
          <button
            type="submit"
            id="saveCategory"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition"
          >
            Add Category
          </button>
        </form>
      </div>

      <!-- Categories List -->
      <div class="bg-white p-6 rounded-lg shadow-md mb-6">
        <h2 class="text-xl font-semibold mb-4">Categories</h2>
        <div id="categoriesContainer" class="space-y-2">
          <!-- Categories will be loaded here -->
        </div>
      </div>

      <!-- Category Books Modal -->
      <div
        id="booksModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4"
      >
        <div
          class="bg-white rounded-lg w-full max-w-2xl max-h-[90vh] overflow-y-auto"
        >
          <div class="p-6">
            <div class="flex justify-between items-center mb-6">
              <h3 class="text-xl font-semibold" id="modalCategoryName"></h3>
              <button
                onclick="closeBooksModal()"
                class="text-gray-500 hover:text-gray-700 text-2xl"
              >
                &times;
              </button>
            </div>

            <!-- Add Book Form -->
            <form id="bookForm" class="mb-6 space-y-4">
              <input type="hidden" id="selectedCategoryId" />
              <div class="grid gap-4 md:grid-cols-2">
                <div>
                  <label class="block text-sm font-medium text-gray-700"
                    >Book Title</label
                  >
                  <input
                    type="text"
                    id="bookTitle"
                    required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700"
                    >Author</label
                  >
                  <input
                    type="text"
                    id="bookAuthor"
                    required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                  />
                </div>
              </div>
              <button
                type="submit"
                class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition"
              >
                Add Book
              </button>
            </form>

            <!-- Books List -->
            <div id="booksContainer" class="space-y-2">
              <!-- Books will be loaded here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js" type="module"></script>
  </body>
</html>
